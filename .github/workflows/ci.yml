name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      
      - name: Inject OpenHands API Key
        run: |
          if [ -n "${{ secrets.OPENHANDS_API_KEY }}" ]; then
            echo "OPENHANDS_API_KEY=${{ secrets.OPENHANDS_API_KEY }}" >> $GITHUB_ENV
            echo "OpenHands API Key configured"
          fi
        
      - name: Download dependencies
        run: go mod download
        
      - name: Run tests
        run: go test -v ./...
        
      - name: Build
        run: go build -o /tmp/aoms ./cmd/api
        
  lint:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest