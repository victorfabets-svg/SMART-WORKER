name: Operational Runtime

on:
  workflow_dispatch:
    inputs:
      task:
        description: 'Operational task to execute (e.g., "fix the hydration runtime")'
        required: true
        type: string
      repository:
        description: 'Target repository (owner/repo)'
        required: true
        type: string

env:
  OPENHANDS_API_KEY: ${{ secrets.OPENHANDS_API_KEY }}
  GITHUB_REPOSITORY: ${{ github.event.inputs.repository }}
  OPERATIONAL_TASK: ${{ github.event.inputs.task }}

jobs:
  operational-execution:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.inputs.repository }}
          fetch-depth: 0
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      
      - name: Auto-analyze operational context
        id: analysis
        run: |
          echo "=== SMART-WORKER Operational Analysis ==="
          echo "Repository: ${{ github.event.inputs.repository }}"
          echo "Task: ${{ github.event.inputs.task }}"
          echo ""
          
          # Auto-infer intent from task keywords
          TASK="${{ github.event.inputs.task }}"
          
          # Infer intent automatically
          INTENT="execution"
          if echo "$TASK" | grep -iqE "investigate|analise|check|investigar"; then
            INTENT="investigation"
          elif echo "$TASK" | grep -iqE "fix|corrija|repair|corrigir"; then
            INTENT="execution"
          elif echo "$TASK" | grep -iqE "plan|planeje|roadmap"; then
            INTENT="planning"
          elif echo "$TASK" | grep -iqE "stop|pare|cancel|interrompa"; then
            INTENT="blocking"
          fi
          echo "INFERRED_INTENT=$INTENT" >> $GITHUB_ENV
          
          # Auto-detect urgency
          URGENCY="medium"
          if echo "$TASK" | grep -iqE "urgente|now|immediately|agora|critical|emergency"; then
            URGENCY="critical"
          elif echo "$TASK" | grep -iqE "soon|rápido"; then
            URGENCY="high"
          fi
          echo "URGENCY=$URGENCY" >> $GITHUB_ENV
          
          echo "Intent: $INTENT (auto-inferred)"
          echo "Urgency: $URGENCY (auto-detected)"
          echo ""
          
          # Auto-collect findings (from recent commits/logs)
          echo "=== Recent Activity ==="
          git log --oneline -5 2>/dev/null || echo "No recent commits"
          echo ""
          
          # Auto-collect roadmap (check for project files)
          echo "=== Project State ==="
          ls -la *.go 2>/dev/null | head -5 || echo "No Go files in root"
          ls -la cmd/ 2>/dev/null || echo "No cmd directory"
          ls -la internal/ 2>/dev/null || echo "No internal directory"
      
      - name: Execute operation
        run: |
          TASK="${{ github.event.inputs.task }}"
          INTENT="${{ env.INFERRED_INTENT }}"
          
          echo "=== Executing: $INTENT ==="
          echo "Task: $TASK"
          
          if [ -n "$OPENHANDS_API_KEY" ]; then
            echo "OpenHands: API Key configured"
            
            # Call OpenHands API with auto-gathered context
            RESPONSE=$(curl -s -X POST \
              "https://app.all-hands.dev/api/v1/app-conversations" \
              -H "Authorization: Bearer $OPENHANDS_API_KEY" \
              -H "Content-Type: application/json" \
              -d '{
                "initial_message": {
                  "content": [{"type": "text", "text": "'"$TASK"'"}]
                },
                "selected_repository": "'${{ github.event.inputs.repository }}'"
              }' 2>&1) || true
            
            echo "OpenHands: Dispatched"
            TASK_ID=$(echo "$RESPONSE" | jq -r '.id // empty' 2>/dev/null)
            if [ -n "$TASK_ID" ]; then
              echo "task_id=$TASK_ID" >> $GITHUB_OUTPUT
            fi
          else
            echo "OpenHands: Not configured - local execution"
            echo "Analyzing repository..."
            go build ./... 2>&1 | head -20 || true
          fi
      
      - name: Validate and build
        run: |
          echo "=== Validation ==="
          if go build -o /tmp/smart-worker ./cmd/api 2>&1; then
            echo "✅ Build successful"
            echo "build=success" >> $GITHUB_OUTPUT
          else
            echo "⚠️ Build warning (non-blocking)"
          fi
      
      - name: Report result
        run: |
          echo "=== Operational Complete ==="
          echo "Repository: ${{ github.event.inputs.repository }}"
          echo "Task: ${{ github.event.inputs.task }}"
          echo "Intent: $INTENT (auto-inferred)"
          echo "Status: completed"