version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: aoms-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: aoms
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aoms-api
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/aoms?sslmode=disable
      PORT: 8080
      LOG_LEVEL: info
      # OpenHands integration
      OPENHANDS_API_KEY: ${OPENHANDS_API_KEY}
      OPENHANDS_BASE_URL: ${OPENHANDS_BASE_URL:-https://app.all-hands.dev}
      GITHUB_REPOSITORY: ${GITHUB_REPOSITORY}
      # OpenAI (optional)
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "8080:8080"
    volumes:
      - .:/app

  telegram-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aoms-telegram-bot
    depends_on:
      - api
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      # OpenHands integration
      OPENHANDS_API_KEY: ${OPENHANDS_API_KEY}
      OPENHANDS_BASE_URL: ${OPENHANDS_BASE_URL:-https://app.all-hands.dev}
      GITHUB_REPOSITORY: ${GITHUB_REPOSITORY}
      # Database
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/aoms?sslmode=disable
      # Logging
      LOG_LEVEL: info
    volumes:
      - .:/app

volumes:
  postgres_data: