version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: aoms-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: aoms
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aoms-api
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/aoms?sslmode=disable
      PORT: 8080
      LOG_LEVEL: info
    ports:
      - "8080:8080"
    volumes:
      - .:/app

volumes:
  postgres_data: